<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniAnima | Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/loader.js"></script>
  <style>
    :root {
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'Archivo', sans-serif;
    }
    .auth-brand-title {
      font-family: var(--font-display);
    }
  </style>
</head>
<body>
  <!-- Top Indeterminate Progress Bar -->
  <div class="top-progress-bar" id="topProgressBar" aria-hidden="true"></div>

  <!-- Minimalist Studio Loader (Pure Infinity Loop) -->
  <div class="app-loader" id="appLoader" role="status" aria-live="polite">
    <div class="loader-backdrop-glow" aria-hidden="true"></div>
    <div class="minimal-loader">
      <div class="infinity-stage" aria-hidden="true">
        <svg class="loader-svg" viewBox="0 0 160 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="loaderStrokeGrad" x1="20" y1="45" x2="140" y2="45" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#1f00ff"/>
              <stop offset="50%" stop-color="#ff622b"/>
              <stop offset="100%" stop-color="#1f00ff"/>
            </linearGradient>
          </defs>
          <path class="infinity-guide" d="M 80 45 C 64 24, 38 24, 38 45 C 38 66, 64 66, 80 45 C 96 24, 122 24, 122 45 C 122 66, 96 66, 80 45 Z"/>
          <path class="infinity-draw" d="M 80 45 C 64 24, 38 24, 38 45 C 38 66, 64 66, 80 45 C 96 24, 122 24, 122 45 C 122 66, 96 66, 80 45 Z"/>
          <g class="stylus-group">
            <circle cx="0" cy="0" r="2.5" class="pen-nib-sparkle"/>
            <path class="pen-tip" d="M 0 0 L -3.5 -2.5 L -4 -0.5 Z"/>
            <path class="pen-body" d="M -3.5 -2.5 L -15 -10.5 L -17 -8 L -4 -0.5 Z"/>
            <path class="pen-accent" d="M -9.5 -6.8 L -12.5 -8.8 L -14 -7 L -11 -5 Z"/>
          </g>
        </svg>
      </div>
      <div class="minimal-loader-caption">
        <span id="loaderCaptionText">Connecting to OmniAnima</span>
        <span class="dots-shimmer"><span>.</span><span>.</span><span>.</span></span>
      </div>
    </div>
  </div>
  <script>
    if (!localStorage.getItem('omni_token') && !localStorage.getItem('sketsa_token')) {
      var _loader = document.getElementById('appLoader');
      if (_loader) _loader.style.display = 'none';
    }
  </script>

  <div class="auth-page">
    <div id="authCard" class="auth-card">
      <div class="logo-section">
        <svg class="omni-logomark auth-logomark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="3" y="3" width="26" height="26" rx="4" stroke="currentColor" stroke-width="2"/>
          <path d="M22 3 L29 10" stroke="currentColor" stroke-width="1.5"/>
          <path d="M16 7 L21 16 L17.5 16 L17.5 24 L14.5 24 L14.5 16 L11 16 Z" fill="currentColor"/>
          <circle cx="16" cy="12" r="1.5" fill="#ffffff"/>
        </svg>
        <div class="brand-title-row">
          <h1 class="auth-brand-title">OMNIANIMA</h1>
        </div>
        <p class="tagline">Electric Blueprint 2D Animation Studio</p>
      </div>

      <div class="tabs-wrapper">
        <div class="tabs">
          <button id="tabLogin" class="tab-btn active" type="button">
            <span>Sign In</span>
          </button>
          <button id="tabRegister" class="tab-btn" type="button">
            <span>Create Account</span>
          </button>
        </div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <div id="loginError" class="error-msg hidden" role="alert"></div>

        <div class="form-group">
          <label class="form-label" for="loginInput">Username or Email</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
            <input type="text" id="loginInput" placeholder="name@email.com or username" autocomplete="username" required>
          </div>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="loginPassword">Password</label>
          </div>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" data-target="loginPassword" title="Show password" aria-label="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="loginBtn">
          <span>Enter Studio</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form hidden">
        <div id="registerError" class="error-msg hidden" role="alert"></div>

        <div class="form-group">
          <label class="form-label" for="regUsername">Username</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
            <input type="text" id="regUsername" placeholder="e.g. awesome_animator" autocomplete="username" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input type="email" id="regEmail" placeholder="name@email.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="regPassword" placeholder="At least 6 characters" autocomplete="new-password" required>
            <button type="button" class="toggle-password" data-target="regPassword" title="Show password" aria-label="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regConfirm">Confirm Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <input type="password" id="regConfirm" placeholder="Re-enter your password" autocomplete="new-password" required>
            <button type="button" class="toggle-password" data-target="regConfirm" title="Show password" aria-label="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="registerBtn">
          <span>Create Account Now</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <footer class="auth-footer">
        <p>© 2026 OmniAnima · Global Cloud Animation Studio</p>
      </footer>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
